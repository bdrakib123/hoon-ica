name: Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/won-ica-safe-features

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run runtime regression tests
        run: npm test
      - name: Check TypeScript declarations
        run: npm run test:types
      - name: Verify npm package contents
        run: npm pack --dry-run
